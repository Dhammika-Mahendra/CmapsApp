<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      html, body, #map { height: 100%; width: 100%; margin: 0; background: #e5eaed; }
      .leaflet-control-container { display: none; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const map = L.map('map', {zoomControl: false, attributionControl: false})
        .setView([6.9271, 79.8612], 12);
      const renderedLayers = {};
      const layerVisibility = {
        'local-admin': false,
        'local-gov': false,
        'col-post': false,
      };
      let localAdminFeatureColorsEnabled = false;

      const localAdminColors = [
        { name: "Ampara", color: "#e11ac7" },
        { name: "Anuradhapura", color: "#e11ac7" },
        { name: "Badulla", color: "#1f8b49" },
        { name: "Batticaloa", color: "#0ecffc" },
        { name: "Colombo", color: "#e11ac7" },
        { name: "Galle", color: "#0ecffc" },
        { name: "Gampaha", color: "#88a4bc" },
        { name: "Hambantota", color: "#0ecffc" },
        { name: "Jaffna", color: "#88a4bc" },
        { name: "Kalutara", color: "#a4ff24" },
        { name: "Kandy", color: "#88a4bc" },
        { name: "Kegalle", color: "#0ecffc" },
        { name: "Kilinochchi", color: "#e11ac7" },
        { name: "Kurunegala", color: "#a4ff24" },
        { name: "Mannar", color: "#88a4bc" },
        { name: "Matale", color: "#0ecffc" },
        { name: "Matara", color: "#e11ac7" },
        { name: "Monaragala", color: "#a4ff24" },
        { name: "Mullaitivu", color: "#0ecffc" },
        { name: "Nuwara Eliya", color: "#e11ac7" },
        { name: "Polonnaruwa", color: "#88a4bc" },
        { name: "Puttalam", color: "#0ecffc" },
        { name: "Ratnapura", color: "#88a4bc" },
        { name: "Trincomalee", color: "#a4ff24" },
        { name: "Vavuniya", color: "#1f8b49" }
      ];

      const defaultLocalAdminColor = '#35a3df';

      const colorForLocalAdmin = name => {
        const normalizedName = (name || '').trim();
        const match = localAdminColors.find(entry => entry.name === normalizedName);

        return match ? match.color : defaultLocalAdminColor;
      };

      const localAdminStyle = feature => {
        const color = colorForLocalAdmin(feature?.properties?.ADM2_EN);

        return {
          color,
          weight: 1,
          fillColor: color,
          fillOpacity: 0.18,
        };
      };

      const localAdminUniformStyle = {
        color: '#1678b6',
        weight: 1,
        fillColor: '#35a3df',
        fillOpacity: 0.18,
      };

      const colPostColors = [ 
        { name: 'Slave Island', color: '#B7E78C' },
        { name: 'Kollupitiya', color: '#505DEA' },
        { name: 'Bambalapitiya', color: '#0DB0C9' },
        { name: 'Narahenpita, Havelock, Kirulapona N', color: '#6EE765' },
        { name: 'Wellawatta, Pamankada, Kirulapona S', color: '#9673E2' },
        { name: 'Cinnamon Garden', color: '#34e8eb' },
        { name: 'Borella', color: '#E80FCF' },
        { name: 'Dematagoda', color: '#A851CA' },
        { name: 'Maradana, Panchikawatte', color: '#D63643' },
        { name: 'Pettah', color: '#D48966' },
        { name: 'Aluthkade', color: '#13D9A4' },
        { name: 'Kotahena, Bloemendhal', color: '#70A1DA' },
        { name: 'Grandpass', color: '#CEA337' },
        { name: 'Mattakkuliya, Modara, Madampitiya', color: '#34e8eb' }
    ];      

      const defaultColPostColor = '#ce93d8';

      const colorForColPost = name => {
        const normalizedName = (name || '').trim();
        const match = colPostColors.find(entry => entry.name === normalizedName);

        return match ? match.color : defaultColPostColor;
      };

      const colPostStyle = feature => {
        const color = colorForColPost(feature?.properties?.name);

        return {
          color,
          weight: 1,
          fillColor: color,
          fillOpacity: 0.16,
        };
      };

      const clearLayer = layerId => {
        const existingLayer = renderedLayers[layerId];

        if (existingLayer) {
          map.removeLayer(existingLayer);
          delete renderedLayers[layerId];
        }
      };

      const buildLayerStyle = layerId => {
        if (layerId === 'local-admin') {
          return localAdminFeatureColorsEnabled ? localAdminStyle : localAdminUniformStyle;
        }

        if (layerId === 'local-gov') {
          return {
            color: '#2e7d32',
            weight: 1,
            fillColor: '#81c784',
            fillOpacity: 0.18
          };
        }

        if (layerId === 'col-post') {
          return colPostStyle;
        }

        return null;
      };

      const loadLayer = async layerId => {
        let geoJsonPath = '';

        if (layerId === 'local-admin') {
          geoJsonPath = 'file:///android_asset/Local_Admin.geojson';
        } else if (layerId === 'local-gov') {
          geoJsonPath = 'file:///android_asset/Local_Gov.geojson';
        } else if (layerId === 'col-post') {
          geoJsonPath = 'file:///android_asset/Col_post.geojson';
        } else {
          return;
        }

        const geoJson = await new Promise((resolve, reject) => {
          const request = new XMLHttpRequest();
          request.open('GET', geoJsonPath, true);
          request.onload = () => {
            if (request.status !== 0 && request.status !== 200) {
              reject(new Error(`Unable to read ${geoJsonPath}`));
              return;
            }
            try {
              resolve(JSON.parse(request.responseText));
            } catch (error) {
              reject(error);
            }
          };
          request.onerror = () => reject(new Error(`Unable to read ${geoJsonPath}`));
          request.send();
        });

        const style = buildLayerStyle(layerId);
        if (!style) return;

        clearLayer(layerId);

        const layer = L.geoJSON(geoJson, { style });
        renderedLayers[layerId] = layer;

        if (layerVisibility[layerId]) {
          layer.addTo(map);
        }
      };

      const refreshLayer = async layerId => {
        if (!layerVisibility[layerId]) {
          clearLayer(layerId);
          return;
        }

        await loadLayer(layerId);
      };

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        minZoom: 2,
        subdomains: 'abc'
      }).addTo(map);

      window.setMapLayerVisibility = async ({layerId, visible}) => {
        layerVisibility[layerId] = visible;

        if (!visible) {
          clearLayer(layerId);
          return;
        }

        try {
          await refreshLayer(layerId);
        } catch (error) {
          console.error('Map layer failed to load', error);
        }
      };

      window.setLocalAdminFeatureColorsEnabled = async ({enabled}) => {
        localAdminFeatureColorsEnabled = enabled;

        try {
          await refreshLayer('local-admin');
        } catch (error) {
          console.error('Local Admin layer failed to refresh', error);
        }
      };
    </script>
  </body>
</html>
